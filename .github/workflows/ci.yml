name: Investo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DJANGO_SETTINGS_MODULE: config.settings.testing
  DB_NAME: investo_test
  DB_USER: investo
  DB_PASSWORD: investo
  DB_HOST: localhost
  DB_PORT: "5432"
  REDIS_URL: redis://localhost:6379/0
  CHANNEL_LAYER_URL: redis://localhost:6379/1

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: investo_test
          POSTGRES_USER: investo
          POSTGRES_PASSWORD: investo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/development.txt
          pip install pytest-xdist

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      # Errors only (syntax, undefined names). The project's full ruff config in
      # pyproject.toml still reports several hundred style findings in apps/.
      - name: Run lint
        run: ruff check apps/ config/ --select E9,F63,F7,F82

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term \
            -q \
            -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
